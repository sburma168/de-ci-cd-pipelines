# ==============================================================
# CI PIPELINE — Continuous Integration
# ==============================================================
# This pipeline runs automatically every time someone:
#   - Pushes code to ANY branch
#   - Opens or updates a Pull Request targeting "main"
#
# Its job is to CHECK that the code is working correctly
# BEFORE it gets merged. This is the "quality gate".
# ==============================================================

name: CI — Run Tests

# TRIGGER: When does this pipeline run?
on:
  push:
    branches: ["**"]       # Every push to any branch
  pull_request:
    branches: ["main"]     # Every PR that targets main

# JOBS: The actual work the pipeline does
jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest   # Use a fresh Linux virtual machine

    steps:

      # STEP 1: Get the code onto the virtual machine
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # STEP 2: Install Node and run JavaScript tests with Jest
      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: ✅ Run tests with npm
        run: npm test --silent